note        = "ARCHIVE, NOT A DELETABLE DUPLICATE. Earlier revisions of this map called it a vendored copy to extract and DELETE, on the assumption that the upstream repos still existed. They do not: hyperpolymath/rhodium-standard-repositories 404s, and 8 of its 10 satellites (rsr-certifier, rsr-deployer, mustfile, robot-repo-automaton, META.scm, ECOSYSTEM.scm, state.scm, well-known-ecosystem) have no external home - this is the LAST COPY. The 2 that do exist (cccp, palimpsest-license) are stale snapshots, not mirrors. Carries its own .gitmodules naming satellites/rsr-template-repo. MOVED 2026-10-09 from the repo root to 9-archive/ as pure git renames with no content change; 1,135 of its 1,137 files came across. actions-allowlist/ did not, and keeps its own residual entry at the old path."

