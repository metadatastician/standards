#
# standards-map.toml - the machine-readable map of metadatastician/standards.
#
# WHY THIS EXISTS
#   The spec registry (retired 2026-10-09, see REGISTRY.adoc) indexed 33 SPECS.
#   This repo had 118 top-level entries. The other 85 had no declared domain,
#   kind, lifecycle or gate, and THAT absence is what made the repo unreadable
#   by machine and by human.
#
# BIDIRECTIONAL, LIKE THE SPINE'S root-allow.txt
#   An entry here MUST exist. A path that exists MUST be listed here.
#   A one-directional allowlist only ever ratchets open - the template's own
#   root-allow.txt learned this the expensive way. Checked by
#   scripts/check-standards-map.sh in CI.
#
# GENERATED RENDERINGS - one map, two readers
#   index.adoc per district  (human)   <- rendered from this file
#   .machine_readable/map.a2ml (machine) <- rendered from this file
#
# FIELDS
#   from         current path at time of writing (the migration source)
#   target       post-reorg path, "-> repo" for a split-out, "DELETE" to remove
#   district     the district this entry belongs to (see 03-STANDARDS-REORG.md)
#   kind         law | format-* | protocol | policy | grading | machinery |
#                measured | onramp | archive | spine-mandated
#   lifecycle    versioned | generated | frozen | deprecated
#   canonical    true  = may be linked normatively by other repos (the SSOT set)
#   canon_slot   join key into canon.lock [canon.artifacts]; "" if not law
#   gate         the CI gate that fails if this entry is wrong

[map]
repo        = "metadatastician/standards"
version     = "1.0.0"
entry_count = 136
generated   = false   # hand-curated; the district index.adoc files ARE generated
checked_by  = "scripts/check-standards-map.sh"

[[district]]
id = "0-canon"
question = "What must a conforming repo BE?"
[[district]]
id = "1-formats"
question = "What do we read and write?"
[[district]]
id = "2-protocols"
question = "How do systems and agents talk?"
[[district]]
id = "3-practice"
question = "How do we work?"
[[district]]
id = "4-readiness"
question = "How mature is it?"
[[district]]
id = "5-machine"
question = "What indexes and enforces all of that?"
[[district]]
id = "6-telemetry"
question = "What is the estate actually like right now?"
[[district]]
id = "9-archive"
question = "What did we used to think?"
[[district]]
id = "onramp"
question = "Where do I start?"
[[district]]
id = "root"
question = "(root entries mandated by the spine's root-allow.txt)"


