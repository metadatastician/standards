[[entry]]
from        = "3-practice/fork-governance"
target      = "3-practice/fork-governance/ (created 2026-10-24)"
district    = "3-practice"
kind        = "policy"
files       = 5
lifecycle   = "versioned"
canonical   = true
canon_slot  = ""
canonical_doc = ""
gate        = "fork-governance"
note        = "The fork governance standard: the one comment every pull request carries, in a fixed order (summary -> k9-deed conformance -> Hypatia verdict grid). Five AsciiDoc files: README (what it is, how to read a row), SPEC (normative comment contract: markers, order, state derivation, single-poster rule), LANES (per-lane implementation, artifacts, permissions), ADOPTION (how another repository turns it on), DISCOVERY (the chain that makes it findable, and what enforces each link). canonical = true: other repositories link to SPEC.adoc normatively when adopting the posting workflow. Implemented by scripts/fork-governance-render.sh (test: scripts/tests/fork-governance-render-test.sh) and .github/workflows/fork-governance{,-reusable}.yml. Discoverable from README.adoc, AGENTS.adoc, .claude/CLAUDE.md, the :governance entry in standards_chora.deed's routing clause, and FORK-GOVERNANCE.adoc propagated into every estate repository by propagate-hooks.yml."

