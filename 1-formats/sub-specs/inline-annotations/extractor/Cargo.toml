[package]
name = "inline-annotations"
version = "0.1.0"
edition = "2021"
description = "Extracts @trust/@contract/@grade annotations from source comments, emits A2ML"
license = "AGPL-3.0-or-later"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/metadatastician/standards"

[[bin]]
name = "inline-annotations"
path = "src/main.rs"

[dependencies]
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
