#
# Machine-readable source of truth for the RSR template-applicability model.
# Human policy: ../TEMPLATE-APPLICABILITY-POLICY.adoc
# Reference checker: ../scripts/check-rsr-profile.sh
#
# A repo carries a gated module iff its rsr-profile's effective capability set
# (preset capabilities + add - remove) contains the module's gating capability.
# Arrays are kept single-line so the checker can parse them with grep.

[meta]
version = "0.3.1"
policy = "0-canon/TEMPLATE-APPLICABILITY-POLICY.adoc"

[capabilities]
# Every capability a profile may declare.
# "plugin" = code hosted inside a third-party extension host (WordPress,
# Zotero, a userscript manager): the host owns the runtime and the packaging
# rules, so host-mandated files are exempt from the usual language gates the
# way interop-target bindings are.
known = ["rust", "zig", "agda", "idris2", "haskell", "gleam", "elixir", "affinescript", "julia", "ocaml", "bash", "cli", "library", "ffi", "abi", "api-service", "formal-proofs", "mobile", "web-ui", "docs-site", "published-package", "container", "reproducible-build", "governance-tier", "benchmarks", "plugin", "deno",
           "canon"]  # "deno": criterion 4.3.1 gates on it; without it here that criterion could never become applicable.
# "canon": the ROLE of hyperpolymath/standards itself (see [canon] below).
# Without it in `known`, a profile declaring role = "canon" is rejected as an
# unknown CAPABILITY rather than accepted as an unknown role.

[baseline]
# Always carried (gate = empty). Globs/dirs allowed; not capability-gated.
# '|' offers alternatives; a path is satisfied if ANY alternative exists.
# GitHub resolves community-health files from .github/ as readily as the root,
# and the estate's canonical location for them IS .github/ - naming only the
# root form marked every conforming repo as missing them.
# Enforced by check-rsr-profile.sh since #1227 (it was prose with no reader).
# Every alternation here is an estate spelling that CONFORMS, not a concession:
# * .adoc is the canonical docs format (ADR-004); .md is accepted where a
#   repository has not migrated and where GitHub itself reads it.
# * 0-AI-MANIFEST: the template retired the .a2ml spelling in favour of .deed
#   (#1229). Demanding only .a2ml made every deed-era repo fail on a file the
#   template itself no longer ships.
# * .well-known: the estate publishes it from www/ since the 2026-09 migration
#   (#851); the root spelling is kept for repos that have not moved.
# * 3-practice/: hyperpolymath/standards keeps its own contributing and
#   conduct guides in a district, not at the root of a 45-directory monorepo.
# A single repo chora deed may carry the manifest and descriptive records.
# The checker recognizes their substantive native AST clauses, not a wildcard
# filename alternative: malformed, empty and wrong-repository records fail.
paths = ["README.adoc", "EXPLAINME.adoc|docs/EXPLAINME.adoc", "LICENSE", "SECURITY.md|.github/SECURITY.md", "CONTRIBUTING.md|.github/CONTRIBUTING.md|CONTRIBUTING.adoc|3-practice/CONTRIBUTING.adoc", "CODE_OF_CONDUCT.md|.github/CODE_OF_CONDUCT.md|CODE_OF_CONDUCT.adoc|3-practice/CODE_OF_CONDUCT.adoc", "CHANGELOG.adoc|CHANGELOG.md", "0-AI-MANIFEST.a2ml|0-AI-MANIFEST.deed", ".machine_readable/descriptiles/|machine-readable/descriptiles/", ".machine_readable/rsr-profile.a2ml|machine-readable/rsr-profile.a2ml", ".well-known/|www/.well-known/", ".gitignore", "Justfile"]

[gates]
# "module path (file, dir/, or glob)" = "gating capability"
# Manifest rows are depth-anchored for the same reason as the src row below
# (#1228): a cargo WORKSPACE keeps its manifests in <crate>/, never at the root.
# Depth is expressed explicitly rather than with `**/` because these rows name a
# FILE, and an unbounded `**/Cargo.toml` would also match vendored trees.
"Cargo.toml|*/Cargo.toml|*/*/Cargo.toml" = "rust"
"Cargo.lock|*/Cargo.lock|*/*/Cargo.lock" = "rust"
# Depth-anchored, not root-anchored (#1228): a cargo WORKSPACE keeps sources in
# <crate>/src/**, so the root-anchored form posted a permanent MISSING on every
# workspace (oikos, four crates, 20+ files) and could never be satisfied.
# `**/src/**/*.rs` matches the single-crate layout as well — bash's globstar
# lets the leading `**/` match zero components.
"**/src/**/*.rs" = "rust"
".github/workflows/rust-ci.yml" = "rust"
# Julia library modules (the julia-library archetype's overlay; the
# #634 reference variant measured 2026-08-25: the language-specific
# delta is exactly these files). test/ (singular) is the Julia
# convention; rust uses tests/ and is ungated here by design.
"Project.toml" = "julia"
"test/" = "julia"
".github/workflows/julia-ci.yml" = "julia"
".github/workflows/julia-docs.yml" = "julia"
"src/interface/ffi/" = "ffi"
"abi.ipkg" = "abi"
"src/interface/abi/|src/interface/Abi/" = "abi"
"src/interface/generated/" = "abi"
# Both layouts carry proof sources. The checker requires a nonempty prover
# source file: an empty directory or a README is not a proof capability.
"verification/proofs/|proofs/agda/" = "formal-proofs"
".github/workflows/e2e.yml" = "api-service"
# A root Containerfile is already an accepted recipe. Requiring an additional
# container/ directory creates empty scaffolding without another obligation.
"build/container/Containerfile|container/Containerfile|Containerfile" = "container"
# Guix is primary; Nix is fallback-only (criterion 1.2.1). As two separate rows
# this demanded BOTH, so every repo that correctly retired Nix failed the gate.
# manifest.scm is the estate's Guix convention and was missing from this row
# (#894); flake.nix is gone because Nix is retired (#1125) — leaving it made a
# retired toolchain count as a satisfied build gate.
"guix.scm|build/guix.scm|manifest.scm" = "reproducible-build"
"affinescript/" = "affinescript"
"benches/" = "benchmarks"
".github/workflows/release.yml" = "published-package"
"docs/AUDIT.adoc|AUDIT.adoc" = "governance-tier"
"docs/AFFIRMATION.adoc|AFFIRMATION.adoc" = "governance-tier"
"docs/GOVERNANCE.adoc|0-canon/GOVERNANCE.adoc|.github/GOVERNANCE.md" = "governance-tier"
"docs/MAINTAINERS.adoc|MAINTAINERS.adoc|3-practice/MAINTAINERS.adoc" = "governance-tier"

[carrier]
# Paths a SPINE (template) repo may carry WITHOUT declaring the gating
# capability, because it carries them for the repos minted from it.
#
# The spine is the one repo for which "present but not declared" is correct
# rather than drift: rsr-template-repo ships rust-ci.yml so that a Rust project
# minted from it has one, while itself carrying no Rust. Before this section the
# model had no way to express that, so it reported the template's entire reason
# for existing as VESTIGIAL - and the template's own profile [notes] had already
# argued, correctly, that declaring capabilities it lacks would be worse.
#
# Applies ONLY where the profile declares role = "spine". A minted repo carrying
# these without the capability is still drift, which is the behaviour that
# matters for the other ~300 repos.
paths = [".github/workflows/rust-ci.yml", ".github/workflows/release.yml", ".github/workflows/e2e.yml", ".github/workflows/boj-build.yml"]

[canon]
# Paths a CANON repo may carry WITHOUT declaring the gating capability, because
# they are the LAW the capabilities are defined BY, not an instance of them.
#
# The [carrier] section above exists because the spine legitimately carries
# modules whose capability it does not have: rsr-template-repo ships
# rust-ci.yml so a Rust project minted from it has one, while itself carrying
# no Rust. Before [carrier] existed the model reported the template's entire
# reason for existing as VESTIGIAL.
#
# The canon has the same shape of problem one layer up, and it has had it for
# longer. hyperpolymath/standards cannot currently be scored by the checker it
# ships (scripts/check-rsr-profile.sh exits 2 on this repo), because:
#
#   * it carries the criteria SSOT, which no capability gates — the criteria
#     are not an instance of `formal-proofs` or anything else, they are the
#     document that DEFINES those criteria;
#   * it carries docs/proofs/ (283 files) but `formal-proofs` means "contains
#     mechanised proofs IN TREE, of its own code" — the canon is prose and has
#     no code to prove, so it fails a criterion that is meaningless for it;
#   * it carries .github/workflows/*-reusable.yml, which every other repo CALLS
#     and the canon SERVES, which no capability describes.
#
# Applies ONLY where the profile declares role = "canon"
# (.machine_readable/rsr-profile.a2ml here and in the spine — the root rename
# landed 2026-09-17; machine-readable/rsr-profile.a2ml is the minority spelling
# and is still resolved).
#
# A minted repo declaring role = "canon" to evade a gate is still drift, which
# is the behaviour that matters for the other ~441 repos.
paths = [
  "0-canon/rsr/rsr-criteria-v2.a2ml",  # the criteria SSOT
  "0-canon/rsr/archive/",              # frozen prior majors
  "0-canon/rsr/RSR-SPEC-v2.adoc",      # prose authority
  ".machine_readable/template-capability-gates.toml",         # this file
  "0-canon/TEMPLATE-APPLICABILITY-POLICY.adoc",
  "0-canon/constitution/",
  ".github/workflows/governance-reusable.yml",                # gates other repos CALL
  ".machine_readable/REGISTRY.a2ml",                          # generated index
  "docs/proofs/",                                             # proof artefacts OF THE ESTATE
  "canon.lock",                                               # the release identity
  "standards-map.toml",
  ".github/workflows/rust-ci.yml",                            # served as rust-ci-reusable.yml
]

[presets]
# OPTIONAL shorthands. A profile may declare `capabilities = [...]` directly
# instead of a preset; presets are pure sugar that expands to a capability set.
# preset name = [ base capabilities ]
# canon = the role of hyperpolymath/standards itself. A one-line shorthand for
# the honest capability set of a prose-and-tooling repo that owns the criteria.
canon = ["bash", "docs-site", "governance-tier"]
rust-cli = ["rust", "cli", "library"]
rust-ffi-lib = ["rust", "zig", "ffi", "abi", "library"]
rust-service = ["rust", "api-service", "container", "reproducible-build"]
formal-proof-lib = ["formal-proofs", "library"]
docs-site = ["docs-site"]
affinescript-app = ["affinescript", "web-ui"]
# Archetype presets (rsr-template-repo archetypes/ carry the matching name;
# see spec/SCAFFOLD-LIFECYCLE.adoc and rsr-template-repo ADR-0003).
julia-library = ["julia", "library", "docs-site", "published-package"]
wordpress-plugin = ["plugin", "web-ui"]
zotero-plugin = ["plugin"]
userscript = ["plugin"]
