#
# repo-catalog.toml
# Estate identity + triage map. FIRST PASS, GENERATED 2026-11-12. Every row has confirmed = false.
# Tier A is the only owner decision recorded so far; the other fields of those rows are still proposals.
# Schema follows ../repo-catalog-template.toml, plus: owner, purpose, what, core_candidate,
# confirmed, and an evidence table.
#
# This file holds PROPOSALS for the owner to confirm or correct. Nothing was changed in any repo.
# Set confirmed = true on a row when its purpose, tier, visibility_target and action are decided.
#
# How each field was made
#   evidence      Measured from a shallow clone (last 50 commits) of each public repo. No build or test was run.
#                 own_src_lines excludes files that are template copies: the same bytes in 5+ repos, or the
#                 same path in 25+ repos at about the same size.
#                 upkeep_share = share of the last 50 commits that touch only .github/, .machine_readable/,
#                 .hooks/, .gitbot-fleet/, .claude/ or top-level files.
#   purpose/what  First-pass reading of the README by a small model. Low-confidence rows are marked.
#   tier          Rule from evidence. E = unfilled template or under 200 own lines. D = under 1500 own lines.
#                 B = real code under development: 18% or more of the last 50 commits change source files,
#                 and the last such commit is 90 days old or less. C = real code below that level.
#                 A is the owner's choice. The owner chose 12 repos on 2026-11-12. core_candidate marks the
#                 repos that had evidence for A; false means the owner did not choose that candidate.
#   visibility_target, action   Proposals that follow from tier and purpose. Nothing was changed in any repo.
#   identity      "canonical" by default.
#
# Limits: private repos are not measured. Names come from the mathesis census of 2026-11-07..09.
# A sweep that edits source files (for example a licence header) counts as a source change.
# activity: developing (rule above), occasional (6% to 18% of commits change source), idle (below 6%).

[meta]
generated = "2026-11-12"
repos = 464
sources = ["mathesis/docs/atlas/census/repos.jsonl", "reposystem/repos.toml", "palimpsest-license/register/REGISTER.adoc", "sonarcloud projects"]

[purpose_classes.infrastructure]
endpoint = "Runs unattended and removes more maintainer work than it adds."

[purpose_classes.product]
endpoint = "An outside person installs it and gets value in 10 minutes."

[purpose_classes.library]
endpoint = "Published in its registry, with compat bounds, docs and passing tests."

[purpose_classes.language]
endpoint = "An outside person installs it and runs a tutorial program end to end."

[purpose_classes.research]
endpoint = "A checked proof artifact or a preprint that states the result."

[purpose_classes.experiment]
endpoint = "A written result (worked or did not), then archive."

[purpose_classes.statement]
endpoint = "The README makes the point. Then freeze."

[purpose_classes.fun]
endpoint = "Playable or shareable. No template burden."

[purpose_classes.content]
endpoint = "Published and linked. Then freeze until the content changes."

[purpose_classes.personal]
endpoint = "Works for the owner. Private."

[purpose_classes.unclear]
endpoint = "Owner states what it is, or archive."

