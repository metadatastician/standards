# SPDX-License-Identifier: MPL-2.0
[package]
name = "js-runtimes"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "One package.json, every JavaScript runtime: keeps the Bun, Deno and pnpm outputs in step, checks each, picks the most-preferred runtime available, and checks the environment provisions Bun (3-practice/LANGUAGE-POLICY.adoc §1.4)."
repository = "https://github.com/metadatastician/standards"
publish = false

[lib]
name = "js_runtimes"
path = "src/lib.rs"

[[bin]]
name = "js-runtimes"
path = "src/main.rs"

[dependencies]
# I-JSON (RFC 7493) + JCS (RFC 8785), in-process (owner ruling D306).
# Pinned by commit: ijson-jcs has no releases yet.
ijson-jcs = { git = "https://github.com/hyperpolymath/ijson-jcs", rev = "3a9a4ee326a968a32b2f152b4faec243a2d00765" }

# Its own workspace root, on purpose. The governance and js-runtimes
# reusables check this crate out at .standards-js/ INSIDE the caller's
# checkout and `cargo install --path` it from there. In a caller whose root
# Cargo.toml is a workspace, cargo would otherwise take this crate for an
# undeclared member and refuse to build it ("current package believes it's
# in a workspace when it's not"). Hit by hyperpolymath/hypatia#929.
[workspace]
