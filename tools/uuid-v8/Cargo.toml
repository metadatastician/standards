# SPDX-License-Identifier: MPL-2.0
[package]
name = "estate-uuid-v8"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "ESTATE-UUID-V8 (ADR-008): profile T (time-ordered) and profile C (SHA-256 of domain:name) identifiers."
repository = "https://github.com/metadatastician/standards"
publish = false

[lib]
name = "estate_uuid_v8"
path = "src/lib.rs"

[[bin]]
name = "uuid-v8"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
uuid = { version = "1.25", features = ["v7"] }
