#
# CodeQL configuration for metadatastician/standards.
#
# ⚠ THIS FILE IS NOT PICKED UP AUTOMATICALLY. `codeql.yml` names it explicitly
# via the reusable's `config-file` input, because codeql-action v4.38.0 does not
# auto-discover `.github/codeql/codeql-config.yml`: `getConfigFileInput()` in
# codeql-action/src/config/file.ts returns `undefined` unless the `config-file`
# input (or a repository property, or default setup) supplies a path, and
# `determineUserConfig()` then logs "No configuration file was provided".
#
# ── Why `paths-ignore` for the archive ─────────────────────────────────────
# `9-archive/` holds *vendored snapshots* of other repositories
# (rhodium-standard-repositories and its satellites/examples), kept as
# provenance for the de-vendoring campaign (standards#493). Two facts make
# alerting on it actively harmful here:
#
#   1. The code is not built, shipped or executed by this repository. A
#      finding there describes software this project does not produce.
#   2. It cannot be fixed. Editing a vendored snapshot destroys the fidelity
#      that is the archive's entire purpose (see the SOLE-SOUND-COPY rows in
#      `.machine_readable/estate-residue-ledger.tsv`), so every alert raised
#      inside it becomes either permanent noise or a dismissal.
#
# The measured effect of leaving it in scope is that archived third-party code
# competes for triage attention with the code that IS shipped — the failure
# mode `docs/audits/2026-08-07-estate-cicd-debt.adoc` records at estate scale
# (545 alerts, 106 gating repositories).
#
# This is an explicit scope boundary, not a suppression: nothing outside
# `paths-ignore` is excluded, and the archive remains covered by the
# text-level content rules in `.hypatia-baseline.json` and the workflow
# staleness gate. De-vendoring (rather than hiding) remains the tracked exit:
# standards#493.
name: "standards CodeQL configuration"

paths-ignore:
  - 9-archive/**
