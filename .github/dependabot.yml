# SPDX-License-Identifier: MPL-2.0
# Estate dependabot policy: see docs/DEPENDABOT-POLICY.adoc (standards#297).
#
# github-actions version updates are OFF (owner ruling "single writer",
# 2026-11-21). Dependabot bumped `uses:` SHAs without touching
# .github/workflows/actions.lock, so the two drifted. The applier
# (.github/workflows/action-pins-applier.yml) now bumps third-party action pins
# and rewrites actions.lock in the SAME commit. `open-pull-requests-limit: 0`
# keeps this file valid and stops every version-update PR, while Dependabot
# security updates are a separate repository setting and are unaffected.
#
# The hold that used to live here (github/codeql-action stays at v4.38.0;
# v4.38.1 fails workflow-startup validation, nexia-list#100/#101/#104) moved to
# config/settings/actions-bump-holds.txt, which the applier reads.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
