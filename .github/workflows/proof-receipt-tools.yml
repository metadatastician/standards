# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: proof-receipt-tools

# The shared proof-receipt tools of PROOF-POLICY §8.5: the reference digest
# (scripts/proof-inputs-sha256.sh), the git checker of §8.5.3
# (scripts/check-proof-receipt.sh) and the generator
# (scripts/proof-receipt.sh), each by its own self-test.  Home repositories
# and Mathesis pin these files by commit and sha256, so each is tested where
# it is written.  The reader they share is tested by deed-conformance.yml.

on:
  pull_request:
    paths:
      - 'scripts/proof-inputs-sha256.sh'
      - 'scripts/check-proof-receipt.sh'
      - 'scripts/proof-receipt.sh'
      - 'scripts/tests/proof-inputs-sha256-test.sh'
      - 'scripts/tests/check-proof-receipt-test.sh'
      - 'scripts/tests/proof-receipt-test.sh'
      - '1-formats/deed/tools/deed_lint.js'
      - '.github/workflows/proof-receipt-tools.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/proof-inputs-sha256.sh'
      - 'scripts/check-proof-receipt.sh'
      - 'scripts/proof-receipt.sh'
      - 'scripts/tests/proof-inputs-sha256-test.sh'
      - 'scripts/tests/check-proof-receipt-test.sh'
      - 'scripts/tests/proof-receipt-test.sh'
      - '1-formats/deed/tools/deed_lint.js'
      - '.github/workflows/proof-receipt-tools.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-tests:
    name: Receipt tools self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Reference digest (proof-inputs-sha256.sh)
        run: bash scripts/tests/proof-inputs-sha256-test.sh
      - name: Git checker of §8.5.3 (check-proof-receipt.sh)
        run: bash scripts/tests/check-proof-receipt-test.sh
      - name: Generator (proof-receipt.sh)
        run: bash scripts/tests/proof-receipt-test.sh
