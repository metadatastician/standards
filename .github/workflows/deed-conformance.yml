# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: deed-conformance

# Conformance lane for the DEED grammar (standards#837).
#
# In this repo (push / pull_request) three gates run: validator self-test,
# fixture corpus, every committed *.deed file.
#
# As a reusable (workflow_call) it lints the CALLER's committed *.deed files
# with the linter at THIS workflow's own commit (job.workflow_sha), so a
# caller pinned to a standards SHA gets exactly that linter.
#
# Caller:
#   jobs:
#     deed:
#       uses: hyperpolymath/standards/.github/workflows/deed-conformance.yml@<sha>
#       with:
#         require-files: true   # fail when the caller has no .deed at all

on:
  push:
    paths:
      - '**.deed'
      - '1-formats/deed/**'
      - '.github/workflows/deed-conformance.yml'
      - 'scripts/uuid-v8.js'
      - 'scripts/tests/bun/**'
      - 'tools/uuid-v8/**'
      - 'scripts/tests/rust/**'
  # No `pull_request` trigger: PR-time DEED conformance runs inside
  # fork-governance.yml, once, for every PR rather than only the ones that touch
  # a .deed path. A second path-filtered run would scan the same commit twice.
  workflow_call:
    inputs:
      require-files:
        description: "Fail when the caller has no committed .deed file (a zero-file run is otherwise a pass)."
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # In this repo the PR's own linter is in the first checkout; a caller
      # gets the linter from the canon checkout at job.workflow_sha.
      T: ${{ (github.repository_id == 1116521501 || github.repository == 'hyperpolymath/standards' || github.repository == 'metadatastician/standards') && '1-formats/deed/tools' || '.deed-canon/1-formats/deed/tools' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: checkout the deed linter at this workflow's commit
        if: github.repository_id != 1116521501 && github.repository != 'hyperpolymath/standards' && github.repository != 'metadatastician/standards'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: ${{ job.workflow_sha }}
          path: .deed-canon
          persist-credentials: false
          sparse-checkout: "1-formats/deed/tools\n"
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: validator self-test
        if: (github.repository_id == 1116521501 || github.repository == 'hyperpolymath/standards' || github.repository == 'metadatastician/standards')
        run: bun "$T/deed_lint.js" --self-test
      - name: validator unit tests
        if: (github.repository_id == 1116521501 || github.repository == 'hyperpolymath/standards' || github.repository == 'metadatastician/standards')
        run: bun test "$T/"
      - name: fixture corpus (valid must pass, invalid must fail)
        if: (github.repository_id == 1116521501 || github.repository == 'hyperpolymath/standards' || github.repository == 'metadatastician/standards')
        run: bun "$T/deed_lint.js" --fixtures "$T/fixtures"
      - name: uuid-v8 generator against an independent sha256sum oracle (#u8 = profile C)
        if: (github.repository_id == 1116521501 || github.repository == 'hyperpolymath/standards' || github.repository == 'metadatastician/standards')
        run: bash scripts/tests/bun/uuid-v8-gen-test.sh
      - name: uuid-v8 Rust generator (tools/uuid-v8) against the same oracle, the bun generator and check-uuid-v8.sh
        if: (github.repository_id == 1116521501 || github.repository == 'hyperpolymath/standards' || github.repository == 'metadatastician/standards')
        run: |
          cargo test --quiet --locked --manifest-path tools/uuid-v8/Cargo.toml
          bash scripts/tests/rust/uuid-v8-rs-test.sh
      - name: lint every committed deed
        env:
          REQUIRE_FILES: ${{ inputs.require-files || false }}
        run: |
          set -euo pipefail
          find . -name '*.deed' -not -path './.deed-canon/*' -not -path './1-formats/deed/tools/fixtures/invalid/*' -print | sort > "$RUNNER_TEMP/deeds"
          if [ ! -s "$RUNNER_TEMP/deeds" ]; then
            if [ "$REQUIRE_FILES" = "true" ]; then
              echo "::error::require-files is set and no committed .deed file was found"
              exit 1
            fi
            echo "no committed .deed files — nothing to lint"
            exit 0
          fi
          echo "linting $(wc -l < "$RUNNER_TEMP/deeds") file(s)"
          xargs bun "$T/deed_lint.js" < "$RUNNER_TEMP/deeds"
          # The (egress …) clause profile (ADR-009). A deed without the clause
          # passes. Its invalid fixtures are grammatical deeds, so they are
          # excluded here rather than from the grammar lint above.
          grep -v '^\./1-formats/deed/tools/fixtures/egress/invalid/' "$RUNNER_TEMP/deeds" \
            | xargs bun "$T/deed_lint.js" --egress
