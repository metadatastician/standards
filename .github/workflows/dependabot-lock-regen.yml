# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Regenerate actions.lock on open Dependabot PRs across the estate, so a
# github-actions bump can no longer land with a stale lock and redden every
# later PR's "Governance / Actions lockfile verify". Logic, guards and the
# reasoning live in scripts/regen-dependabot-locks.sh; this file only mints the
# credentials and runs it.
#
# CREDENTIAL: the estate's dedicated applier App — vars.APP_ID and
# secrets.APP_PRIVATE_KEY, the same slot apply-workflow-pins.yml reads
# (owner ruling STD-R-3: NOT OikosBot, which is a ruleset
# bypass actor). Needs Contents R/W, Workflows R/W, Pull requests R/W (the
# default-branch repair opens PRs), and must be installed on BOTH owners. Until
# it exists the run warns and exits 0.
#
# DEFAULT-BRANCH REPAIR: the 04:41 UTC tick (or dispatch with main-repair) also
# sets REGEN_MAIN=1, which opens one lock-only PR where a stale lock already
# landed on the default branch (drift merged before this workflow could catch
# it). Every other tick only repairs open Dependabot and applier PRs.
name: Dependabot lock regeneration

on:
  schedule:
    - cron: '23,53 * * * *'
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Only this owner/repo (empty = every installed repo)'
        required: false
        default: ''
      dry-run:
        description: 'Regenerate and report, but commit nothing'
        type: boolean
        default: false
      main-repair:
        description: 'Also repair a stale actions.lock on each default branch (opens a PR)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An installation token is scoped to ONE owner, so mint one per owner.
      - name: Mint an App installation token for hyperpolymath
        id: tok-user
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        continue-on-error: true
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: hyperpolymath
      - name: Mint an App installation token for metadatastician
        id: tok-org
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        continue-on-error: true
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: metadatastician

      - name: Install the lock tooling (same pin as the governance gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq gawk >/dev/null
          gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Regenerate Dependabot PR lockfiles
        env:
          REGEN_TOKENS: >-
            hyperpolymath=${{ steps.tok-user.outputs.token }}
            metadatastician=${{ steps.tok-org.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
          REGEN_MAIN: ${{ (github.event.schedule == '41 4 * * *' || inputs.main-repair) && '1' || '0' }}
          ONLY_REPO: ${{ inputs.repo }}
        run: |
          # A token is an empty string when the App is absent or not installed
          # on that owner; the script names each owner it did NOT examine.
          bash scripts/regen-dependabot-locks.sh ${ONLY_REPO:+"$ONLY_REPO"} | tee "$RUNNER_TEMP/regen.txt"
          {
            echo '### Dependabot lock regeneration'
            echo '```'
            cat "$RUNNER_TEMP/regen.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
