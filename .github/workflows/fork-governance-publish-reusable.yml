#
# fork-governance-publish-reusable.yml — publish the Fork governance comment
# for a pull request from a fork.
#
# On a fork PR GitHub gives the `pull_request` run a read-only token, so
# fork-governance-reusable.yml cannot post there. It uploads the rendered body
# as the `fork-governance-comment` artifact instead, and this workflow, called
# from a `workflow_run` workflow, posts it. A `workflow_run` workflow always
# runs the default branch's copy of itself with the base repository's token,
# so nothing the fork changed runs here.
#
# THE ARTIFACT IS UNTRUSTED DATA. It was written by a run of the fork's code
# (a fork PR can edit the workflow files its own run uses), so nothing in it
# is executed, and every field is checked before it is used:
#
#   * pr_number must be a positive integer naming an OPEN pull request whose
#     head is the commit the triggering run built (workflow_run.head_sha),
#     from the fork and the branch that run came from (head_repository,
#     head_branch). workflow_run.pull_requests would name the PR directly, but
#     GitHub leaves it empty for runs from forks, so the PR is matched on all
#     three. Two PRs share all three only when one fork branch is opened
#     against two base branches; both are then the same author's, at the same
#     commit, so neither can be used to write over someone else's comment.
#   * the body must start with the fork-governance marker and fit in a comment.
#
# What it cannot check is that the verdicts are honest: a fork's run can
# render any body for its own pull request. The comment therefore says it was
# published from a fork run; the lane check runs on the PR, not this comment,
# are what branch protection should require (ADOPTION.adoc §4).
#
# One comment per pull request, updated in place: the same marker and author
# lookup as fork-governance-reusable.yml, so a same-repository and a fork run
# can never produce two comments.
#
# Documented in 3-practice/fork-governance/ADOPTION.adoc.

name: Fork governance publish (reusable)

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the artifact fork-governance-reusable.yml uploads on a fork PR."
        type: string
        required: false
        default: "fork-governance-comment"
      grid-author:
        description: "The account whose previous comment is updated. Only this account's comment is trusted."
        type: string
        required: false
        default: "github-actions[bot]"

permissions: {}

jobs:
  publish:
    name: Publish the fork governance summary (fork PR)
    # Only a completed pull_request run from a fork has anything to publish;
    # every other run posted its own comment.
    if: >-
      ${{ github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.head_repository.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One publisher at a time per fork branch, so the read-compare-write of
    # the comment below never interleaves with another publisher's.
    concurrency:
      group: fork-governance-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download the rendered comment
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/fork-governance-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # A run may leave no artifact only when it was replaced: a newer attempt
      # of the same run, or a newer push to the fork branch (a newer run at a
      # different commit; a push re-runs every pull request from the branch,
      # so each one gets its own successor). Anything else is a missing report
      # and fails here, including a run cancelled by hand with no successor.
      - name: Fail on a missing comment
        if: ${{ steps.download.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          pushed=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs" \
              -f event=pull_request -f branch="$RUN_HEAD_BRANCH" -f per_page=100 \
            | jq --arg repo "$RUN_HEAD_REPO" --arg sha "$RUN_HEAD_SHA" --argjson id "$RUN_ID" \
                '[.workflow_runs[] | select(.head_repository.full_name == $repo and .id > $id and .head_sha != $sha)] | length')
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.run_attempt')
          if [ "$pushed" -gt 0 ] || [ "$attempt" -gt "$RUN_ATTEMPT" ]; then
            echo "$RUN_URL left no comment, but a newer push or attempt replaced it; that run publishes."
            exit 0
          fi
          echo "::error::$RUN_URL ($RUN_CONCLUSION) uploaded no fork-governance-comment artifact and nothing replaced it, so its pull request has no governance comment"
          exit 1

      - name: Publish the comment
        if: ${{ steps.download.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GRID_AUTHOR: ${{ inputs.grid-author }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/fork-governance-comment"
          body="$dir/body.md"
          meta="$dir/meta.json"
          [ -f "$body" ] && [ -f "$meta" ] || { echo "::error::artifact is missing body.md or meta.json"; exit 1; }

          pr=$(jq -r '.pr_number // ""' "$meta")
          if ! [[ "$pr" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::artifact pr_number is not a pull request number"; exit 1
          fi

          # The pull request must be this run's own: open, at the commit the
          # run built, from the fork and branch the run came from (header).
          # Captured first, so a failed lookup fails the step under `set -e`
          # instead of reading as "not open".
          pr_info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
            --jq '[.state, .head.sha, (.head.repo.full_name // "-"), .head.ref] | join(" ")')
          # A git ref cannot contain whitespace, so the branch is the last field.
          read -r pr_state pr_sha pr_repo pr_branch <<< "$pr_info"
          if [ "$pr_state" != open ]; then
            echo "Pull request #$pr is $pr_state; nothing to publish."; exit 0
          fi
          if [ "$pr_sha" != "$RUN_HEAD_SHA" ]; then
            echo "Pull request #$pr has moved past $RUN_HEAD_SHA; its newer run publishes."; exit 0
          fi
          if [ "$pr_repo" != "$RUN_HEAD_REPO" ] || [ "$pr_branch" != "$RUN_HEAD_BRANCH" ]; then
            echo "::error::artifact names #$pr, which is not from $RUN_HEAD_REPO:$RUN_HEAD_BRANCH"; exit 1
          fi

          # Line 1 must be exactly the marker (SPEC §2.1): a prefix match would
          # let a fork append an unclosed "<!--" to it and hide what follows.
          marker='<!-- fork-governance-verdict: regenerated on every run -->'
          # Byte-exact: command substitution would drop NUL bytes, so compare
          # the raw first line, newline included, with cmp.
          if ! head -n 1 "$body" | cmp -s - <(printf '%s\n' "$marker"); then
            echo "::error::body's first line is not exactly the fork-governance marker"; exit 1
          fi
          # The notice goes on line 2, before any of the fork's text, so nothing
          # the fork wrote (an unclosed HTML comment, an open <details>) can
          # hide it; a footer after the body could be hidden that way. The run
          # stamp is the comment's last line, written here and never by the
          # fork, so the last stamp in a comment is always the publisher's.
          {
            printf '%s\n' "$marker"
            printf '<sub>Rendered by the fork pull request run %s and published by fork-governance-publish. Everything below was written by that run; branch protection relies on the lane checks, not on this comment.</sub>\n' "$RUN_URL"
            tail -n +2 "$body"
            printf '\n<!-- fork-governance-publish-run: %s.%s -->\n' "$RUN_ID" "$RUN_ATTEMPT"
          } > "$dir/published.md"
          # GitHub's limit is 65536 characters, not bytes; the glyphs are
          # multibyte, so count characters.
          if [ "$(LC_ALL=C.UTF-8 wc -m < "$dir/published.md")" -gt 65000 ]; then
            echo "::error::body exceeds the 65000-character comment limit"; exit 1
          fi

          existing=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            | jq -c --arg a "$GRID_AUTHOR" \
                '[.[][] | select((.user.login // "") == $a and ((.body // "") | contains("<!-- fork-governance-verdict:")))]
                 | last // {} | {id: (.id // ""), body: (.body // "")}')
          comment_id=$(jq -r '.id' <<< "$existing")
          # Runs for one pull request can finish out of order (a re-run, or a
          # close and reopen). Never replace a comment a newer run published:
          # compare this run's id, then attempt, with the comment's last stamp.
          stamp=$(jq -r '.body' <<< "$existing" \
            | sed -n 's/^<!-- fork-governance-publish-run: \([0-9]*\)\.\([0-9]*\) -->$/\1 \2/p' | tail -n 1)
          if [ -n "$stamp" ]; then
            read -r prev_id prev_attempt <<< "$stamp"
            if [ "$prev_id" -gt "$RUN_ID" ] || { [ "$prev_id" -eq "$RUN_ID" ] && [ "$prev_attempt" -gt "$RUN_ATTEMPT" ]; }; then
              echo "#$pr already carries the comment from newer run $prev_id.$prev_attempt; leaving it."; exit 0
            fi
          fi

          jq -n --rawfile body "$dir/published.md" '{body: $body}' > "$dir/comment.json"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input "$dir/comment.json" >/dev/null
            echo "updated the fork governance comment on #$pr ($comment_id)"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              --input "$dir/comment.json" >/dev/null
            echo "posted the fork governance comment on #$pr"
          fi
