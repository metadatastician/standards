# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# README single-source derivation — Reusable Workflow (ADR-004)
#
# Author READMEs once in AsciiDoc; derive README.md ONLY for repos that
# declare a Markdown consumer in their descriptiles. This workflow reads that
# declaration, regenerates the derived file behind a fail-closed vocabulary
# gate, and (in the default check mode) fails-and-tells if the committed
# README.md is stale — it never self-commits and never converts an undeclared
# repo. Absence of a declaration is a machine-readable "do not convert": the
# anti-runaway guard that the June 2026 estate-wide .adoc->.md sweep lacked.
name: README Derive Reusable Workflow

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label
        type: string
        required: false
        default: ubuntu-latest
      threshold:
        description: Vocabulary-preservation floor (percent). ADR-004 default 98.
        type: number
        required: false
        default: 98
      standards-ref:
        description: >-
          Ref of metadatastician/standards to source the vocab-gate script
          from. Leave EMPTY to use this reusable's own commit
          (job.workflow_sha) — the standards commit the caller pinned. A
          branch here (the old default, "main") means one push to standards
          changes the vocabulary floor enforced on every already-pinned
          caller, with no review in their repository.
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read

# No concurrency block here on purpose. Inside a called workflow github.workflow
# resolves to the CALLER's name, so a group declared on both sides collides and
# the run cancels itself before any job starts (README Derive: 0 jobs on every
# main run from 2026-07-28 to 2026-10-13). Callers own concurrency.

jobs:
  derive-readme:
    name: Derive & verify README.md
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Read publishing declaration
        id: decl
        run: |
          # Prefer descriptiles; fall back to the deprecated 6a2 dir during the
          # estate migration. No file / no [publishing.readme] table / derive
          # not true => this repo has opted out and we do nothing.
          ECO=""
          for c in .machine_readable/descriptiles/ECOSYSTEM.a2ml \
                   .machine_readable/6a2/ECOSYSTEM.a2ml; do
            if [ -f "$c" ]; then ECO="$c"; break; fi
          done

          if [ -z "$ECO" ]; then
            echo "No ECOSYSTEM.a2ml found — repo not opted in. Nothing to derive."
            echo "derive=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Reading declaration from: $ECO"

          # Extract the flat [publishing.readme] table into KEY=VALUE lines.
          eval "$(
            awk '
              /^[[:space:]]*\[/ { inblk = ($0 ~ /^[[:space:]]*\[publishing\.readme\][[:space:]]*$/) ? 1 : 0; next }
              inblk && /=/ {
                key = $0; sub(/=.*/, "", key); gsub(/[[:space:]]/, "", key)
                val = $0; sub(/^[^=]*=[[:space:]]*/, "", val)
                sub(/[[:space:]]*(#.*)?$/, "", val)          # strip trailing comment/space
                gsub(/^"|"$/, "", val)                        # strip surrounding quotes
                if (key ~ /^(canonical|derive|format|path|consumer)$/)
                  printf "DECL_%s=%s\n", toupper(key), val
              }
            ' "$ECO"
          )"

          if [ "${DECL_DERIVE:-false}" != "true" ]; then
            echo "[publishing.readme] absent or derive != true — repo not opted in."
            echo "derive=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CANONICAL="${DECL_CANONICAL:-README.adoc}"
          DERIVED_PATH="${DECL_PATH:-README.md}"
          FORMAT="${DECL_FORMAT:-gfm}"
          CONSUMER="${DECL_CONSUMER:-unspecified}"

          if [ ! -f "$CANONICAL" ]; then
            echo "::error::Declared canonical '$CANONICAL' does not exist."
            exit 1
          fi
          if [ "$FORMAT" != "gfm" ]; then
            echo "::error::Unsupported derived format '$FORMAT' (only 'gfm' is implemented)."
            exit 1
          fi

          echo "Opted in: consumer=$CONSUMER  $CANONICAL -> $DERIVED_PATH ($FORMAT)"
          {
            echo "derive=true"
            echo "canonical=$CANONICAL"
            echo "derived_path=$DERIVED_PATH"
            echo "consumer=$CONSUMER"
          } >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        if: steps.decl.outputs.derive == 'true'
        env:
          # Pinned so derivation is REPRODUCIBLE: the same versions used to
          # generate the committed README.md must run in CI, or the freshness
          # check would flag cosmetic toolchain-drift diffs as staleness. Bump
          # deliberately (and regenerate every derived README) — never float.
          PANDOC_VERSION: "3.10"
          ASCIIDOCTOR_VERSION: "2.0.26"
          ASCIIDOCTOR_REDUCER_VERSION: "1.1.1"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          sudo gem install --no-document \
            "asciidoctor:${ASCIIDOCTOR_VERSION}" \
            "asciidoctor-reducer:${ASCIIDOCTOR_REDUCER_VERSION}"
          pandoc --version | head -1
          asciidoctor --version | head -1

      - name: Fetch vocab-gate script from standards
        if: steps.decl.outputs.derive == 'true'
        env:
          STANDARDS_REF: ${{ inputs.standards-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          # Version-locked to the standards commit that owns this workflow.
          #
          # A fetch, not `git clone --branch`: --branch takes a BRANCH, so it
          # cannot express the immutable commit this step must name, and the
          # old default ("main") made the vocabulary floor follow standards
          # main for every already-pinned caller. `git fetch origin <sha>`
          # works for a commit and, when a caller deliberately overrides
          # standards-ref with a branch, for that too.
          # A ref must not be mistakable for a git option: `git fetch origin
          # --all` would fetch everything and leave FETCH_HEAD unpinned.
          if ! printf '%s' "$STANDARDS_REF" | grep -Eq '^([0-9a-f]{40}|[A-Za-z0-9_][A-Za-z0-9._/-]*)$'; then
            echo "::error::standards-ref resolved to an unusable value: '${STANDARDS_REF}'"
            exit 1
          fi
          git init -q "$RUNNER_TEMP/standards"
          git -C "$RUNNER_TEMP/standards" remote add origin \
            https://github.com/metadatastician/standards.git
          git -C "$RUNNER_TEMP/standards" fetch -q --depth 1 origin "$STANDARDS_REF"
          git -C "$RUNNER_TEMP/standards" checkout -q --detach FETCH_HEAD
          echo "Vocab-gate source: standards@$(git -C "$RUNNER_TEMP/standards" rev-parse HEAD) (requested ${STANDARDS_REF})"
          chmod +x "$RUNNER_TEMP/standards/.github/scripts/readme-vocab-gate.sh"

      - name: Anchor-ID convention guard
        if: steps.decl.outputs.derive == 'true'
        env:
          CANONICAL: ${{ steps.decl.outputs.canonical }}
        run: |
          set -euo pipefail
          # A canonical .adoc with intra-document anchor links (link:#foo[] or
          # <<foo>> written as #foo) only renders a working TOC on GitHub and
          # re-derives to matching Markdown anchors when it opts out of
          # Asciidoctor's default '_prefixed_underscored' section IDs. So if the
          # source uses #anchors, it MUST set :idprefix: (empty) and
          # :idseparator: -  — otherwise every TOC link silently dead-links
          # (a failure the vocabulary gate cannot see, since it checks words not
          # link targets). See ADR-004 "Bootstrapping a canonical .adoc".
          if grep -qE 'link:#[a-z0-9-]+\[' "$CANONICAL"; then
            if ! grep -qE '^:idprefix:[[:space:]]*$' "$CANONICAL" \
               || ! grep -qE '^:idseparator:[[:space:]]+-[[:space:]]*$' "$CANONICAL"; then
              echo "::error::$CANONICAL has intra-doc anchor links (link:#…) but does not set ':idprefix:' (empty) and ':idseparator: -' in its header. Without them Asciidoctor generates '_underscored' section IDs and every #anchor TOC link dead-links on GitHub and in the derived README.md. Add both attributes to the document header (see ADR-004)."
              exit 1
            fi
            echo "✓ anchor-ID convention satisfied (idprefix/idseparator set)"
          else
            echo "✓ no intra-doc anchors — convention not required"
          fi

      - name: Derive Markdown from AsciiDoc
        if: steps.decl.outputs.derive == 'true'
        env:
          CANONICAL: ${{ steps.decl.outputs.canonical }}
        run: |
          set -euo pipefail
          # This step COMMITS what it generates, so a diagnostic that does not
          # stop it is a wrong README baked into a consumer repo. Neither tool
          # below reports cleanliness through its exit code by default, and
          # each needs a different remedy:
          #
          #   asciidoctor's --failure-level defaults to FATAL, so even
          #   "ERROR: dropping cells from incomplete row" exits 0 — one stray
          #   '|' in a table cell shifts every later cell and the derived
          #   Markdown silently loses them. The flag below makes the exit code
          #   mean what `set -e` already assumes it means.
          #
          #   asciidoctor-reducer has no --failure-level at all (only
          #   --log-level, which changes what is printed, not what is
          #   returned), so its exit code cannot be made to carry its verdict.
          #   Its stderr is captured and treated as the verdict instead.
          #
          # 1) flatten includes so the source is self-contained
          asciidoctor-reducer "$CANONICAL" -o "$RUNNER_TEMP/reduced.adoc" \
            2>"$RUNNER_TEMP/reducer.err"
          if [ -s "$RUNNER_TEMP/reducer.err" ]; then
            echo "::error::asciidoctor-reducer reported a problem flattening $CANONICAL, so the derived README would be generated from a source it could not read cleanly. Its exit code is 0 either way, which is why this is checked on stderr."
            cat "$RUNNER_TEMP/reducer.err" >&2
            exit 1
          fi
          # 2) reliable route: asciidoc -> docbook -> gfm (direct converters lose structure)
          asciidoctor --failure-level=WARN -b docbook5 -a attribute-missing=drop \
            "$RUNNER_TEMP/reduced.adoc" -o "$RUNNER_TEMP/reduced.xml"
          pandoc -f docbook -t gfm --wrap=preserve \
            "$RUNNER_TEMP/reduced.xml" -o "$RUNNER_TEMP/body.md"

          # 3) stamp: carry the canonical SPDX line (rewritten as an HTML
          #    comment) + a GENERATED banner so no one hand-edits the artefact.
          SPDX="$(grep -m1 -oE 'SPDX-License-Identifier:[[:space:]]*[^[:space:]]+' "$CANONICAL" || true)"
          {
            [ -n "$SPDX" ] && echo "<!-- $SPDX -->"
            echo "<!-- GENERATED from $CANONICAL by standards/.github/workflows/readme-derive-reusable.yml — do not edit. -->"
            echo ""
            cat "$RUNNER_TEMP/body.md"
          } > "$RUNNER_TEMP/derived.md"

      - name: Vocabulary-preservation gate
        if: steps.decl.outputs.derive == 'true'
        env:
          CANONICAL: ${{ steps.decl.outputs.canonical }}
        run: |
          "$RUNNER_TEMP/standards/.github/scripts/readme-vocab-gate.sh" \
            "$CANONICAL" "$RUNNER_TEMP/derived.md" "${{ inputs.threshold }}"

      - name: Freshness check (fail-and-tell)
        if: steps.decl.outputs.derive == 'true'
        env:
          DERIVED_PATH: ${{ steps.decl.outputs.derived_path }}
          CANONICAL: ${{ steps.decl.outputs.canonical }}
        run: |
          set -euo pipefail
          # Normalise before comparing: drop the banner comment lines, trim
          # trailing whitespace, and squeeze blank-line runs. The toolchain is
          # version-pinned so output is reproducible; this normalisation is a
          # belt-and-braces layer that keeps a harmless whitespace nudge from
          # being reported as staleness, while any real prose/structure/anchor
          # change still shows.
          norm() { grep -vE '^<!-- (SPDX-License-Identifier|GENERATED)' "$1" \
                   | sed 's/[[:space:]]*$//' | cat -s; }
          if [ ! -f "$DERIVED_PATH" ]; then
            echo "::error::Declared derived README '$DERIVED_PATH' is missing. Regenerate and commit it."
            SHOW_CMD=1
          elif ! diff -q <(norm "$RUNNER_TEMP/derived.md") <(norm "$DERIVED_PATH") >/dev/null; then
            echo "::error::'$DERIVED_PATH' is STALE relative to '$CANONICAL'. Regenerate and commit it."
            echo "----- diff (committed vs regenerated, normalised) -----"
            diff <(norm "$DERIVED_PATH") <(norm "$RUNNER_TEMP/derived.md") || [ $? -eq 1 ]
            SHOW_CMD=1
          else
            echo "✓ $DERIVED_PATH is up to date with $CANONICAL"
            exit 0
          fi

          cat <<'EOF'

          To regenerate locally (requires asciidoctor, asciidoctor-reducer, pandoc):

            asciidoctor-reducer README.adoc -o /tmp/reduced.adoc     # must print nothing
            asciidoctor --failure-level=WARN -b docbook5 -a attribute-missing=drop /tmp/reduced.adoc -o /tmp/reduced.xml
            pandoc -f docbook -t gfm --wrap=preserve /tmp/reduced.xml -o /tmp/body.md
            # then prepend the SPDX + GENERATED banner (see the workflow's stamp step)

          Fail-and-tell mode (ADR-004): CI does not auto-commit. Commit the
          regenerated README.md yourself.
          EOF
          exit 1
