#
# changelog-reusable.yml — Generate CHANGELOG.md from conventional commits.
#
# Closes Item 3 of the 2026-05-26 estate tech-debt audit follow-up: 65% of
# estate repos (180/279) had no CHANGELOG.md. This reusable wires up git-cliff
# with the canonical config at `hyperpolymath/standards/templates/cliff.toml`.
#
# Caller example (auto-update CHANGELOG.md on every push to main):
#   jobs:
#     changelog:
#       uses: hyperpolymath/standards/.github/workflows/changelog-reusable.yml@571cc734cd69fb846032ec77a662aa8ee4fc32cd
#       permissions:
#         contents: write
#         pull-requests: write
#
# Modes (controlled by the `mode` input):
#   `commit-back`   - default. On push to main, regenerate CHANGELOG.md and
#                     commit it back to the same branch (uses
#                     `GITHUB_TOKEN`). Skip if no change.
#   `pr-back`       - On push to main, open a PR with the regenerated
#                     CHANGELOG.md (good for repos with branch protection
#                     that disallows direct pushes to main).
#   `release-only`  - Only generate on a `release` event; attach as an artifact
#                     to the release. Does not modify the repo state.
#   `check-only`    - Render the changelog but do NOT commit. Fail the job if
#                     the on-disk CHANGELOG.md disagrees with the regenerated
#                     output. Use as a `pull_request` gate.
#
# Loop-prevention (surfaced by maa-framework PR #219): two complementary guards
# prevent the workflow from reacting to its own output and opening an infinite
# chain of changelog PRs:
#   1. The canonical cliff.toml has a `skip = true` parser for the bot's own
#      "chore(changelog): regenerate from conventional commits" subjects. This
#      is the primary fix because it survives GitHub squash-merge (which uses
#      the PR title as the new subject).
#   2. Every commit/PR this workflow produces carries a [skip changelog]
#      marker in its body, and the `guard` job below bails out entirely when
#      the triggering HEAD commit already has that marker. This protects
#      `commit-back` mode callers (where the auto commit lands directly on
#      main without a squash step) and provides defense-in-depth for pr-back.

on:
  workflow_call:
    inputs:
      mode:
        description: 'commit-back | pr-back | release-only | check-only'
        required: false
        type: string
        default: 'commit-back'
      runs-on:
        description: 'Runner label'
        required: false
        type: string
        default: 'ubuntu-latest'
      git-cliff-version:
        description: 'Version of git-cliff to install (semver, no leading v)'
        required: false
        type: string
        default: '2.6.1'

permissions:
  actions: read
  contents: read

jobs:
  guard:
    timeout-minutes: 10
    name: Check for self-trigger loop
    runs-on: ${{ inputs.runs-on }}
    outputs:
      skip: ${{ steps.loopguard.outputs.skip }}
    steps:
      - name: Checkout caller (HEAD only is enough for the guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          fetch-depth: 1
          path: caller

      - name: Loop guard
        id: loopguard
        working-directory: caller
        run: |
          set -euo pipefail
          # If the push that triggered us is itself a changelog regeneration
          # (commit-back's direct commit, or a squash-merged pr-back PR whose
          # body still contains the [skip changelog] marker placed below),
          # skip the whole generate job. cliff.toml's subject-matcher is the
          # primary fix; this guard handles cases where the marker is on the
          # body (e.g. commit-back mode, rebase-merges, mergers who preserve
          # the PR body).
          if git log -1 --pretty=%B | grep -q '\[skip changelog\]'; then
            echo "HEAD commit carries [skip changelog]; skipping generate job to break the regenerate loop."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    timeout-minutes: 10
    name: Generate CHANGELOG.md
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout caller repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          fetch-depth: 0
          path: caller

      - name: Checkout standards (for canonical cliff.toml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          # This reusable's own commit, not `main`. A caller pinned here must
          # get the CHANGELOG policy of the standards commit it pinned: the
          # canonical cliff.toml decides what reaches a release note, and a
          # float means one push to standards can rewrite the changelog of
          # every already-pinned caller with no review in their repository.
          # scripts/check-standards-helper-pins.sh holds this shape.
          ref: ${{ job.workflow_sha }}
          path: standards

      - name: Install git-cliff
        run: |
          set -euo pipefail
          version="${{ inputs.git-cliff-version }}"
          asset="git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/orhun/git-cliff/releases/download/v${version}/${asset}"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp/${asset}"
          tar -C "$tmp" -xzf "$tmp/${asset}"
          # Move binary onto PATH (the tarball extracts to a versioned dir).
          install -m 0755 "$tmp"/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          git-cliff --version

      - name: Pick the cliff.toml to use
        id: cfg
        run: |
          set -euo pipefail
          if [ -f caller/cliff.toml ]; then
            echo "Using caller's own cliff.toml"
            echo "path=caller/cliff.toml" >> "$GITHUB_OUTPUT"
          else
            echo "Using canonical cliff.toml from standards"
            echo "path=standards/templates/cliff.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CHANGELOG.md
        working-directory: caller
        run: |
          set -euo pipefail
          git-cliff \
            --config "../${{ steps.cfg.outputs.path }}" \
            --output CHANGELOG.md.new
          wc -l CHANGELOG.md.new
          echo "::group::CHANGELOG preview (first 40 lines)"
          head -40 CHANGELOG.md.new
          echo "::endgroup::"

      - name: Mode = check-only — verify no drift
        if: ${{ inputs.mode == 'check-only' }}
        working-directory: caller
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: caller has no CHANGELOG.md; check-only mode requires one to exist."
            echo "Adopt mode=commit-back to seed it, then switch to check-only."
            exit 1
          fi
          if ! diff -q CHANGELOG.md CHANGELOG.md.new >/dev/null; then
            echo "ERROR: CHANGELOG.md is out of date relative to commit history."
            echo "Run git-cliff locally or switch to mode=commit-back."
            diff -u CHANGELOG.md CHANGELOG.md.new | head -60
            exit 1
          fi
          echo "CHANGELOG.md is up to date."

      - name: Mode = commit-back — commit regenerated CHANGELOG.md
        if: ${{ inputs.mode == 'commit-back' && github.event_name == 'push' }}
        working-directory: caller
        env:
          # Never interpolate `${{ github.ref_name }}` into the shell body
          # (CodeQL actions/command-injection): a git ref may legally contain
          # `$`, `(`, `)`, `;`, `|` and `&`, so a branch named `$(cmd)` is
          # executed by the runner. Passing it through `env:` makes it data.
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f CHANGELOG.md ] && diff -q CHANGELOG.md CHANGELOG.md.new >/dev/null; then
            echo "No CHANGELOG changes; skipping commit."
            exit 0
          fi
          mv CHANGELOG.md.new CHANGELOG.md
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit after move (race condition)."
            exit 0
          fi
          git commit -m "chore(changelog): regenerate from conventional commits

          [skip changelog]

          Auto-generated by hyperpolymath/standards changelog-reusable.yml.
          See standards/templates/cliff.toml for the canonical config.

          Closes part of the 2026-05-26 CHANGELOG gap (standards#197 audit)."
          git push origin "HEAD:$BRANCH"

      - name: Mode = pr-back — open PR with regenerated CHANGELOG.md
        if: ${{ inputs.mode == 'pr-back' && github.event_name == 'push' }}
        working-directory: caller
        env:
          GH_TOKEN: ${{ github.token }}
          # Same reason as the commit-back step: ref names reach the shell as
          # data, never as template expansion (actions/command-injection).
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f CHANGELOG.md ] && diff -q CHANGELOG.md CHANGELOG.md.new >/dev/null; then
            echo "No CHANGELOG changes; skipping PR."
            exit 0
          fi
          mv CHANGELOG.md.new CHANGELOG.md
          branch="bot/changelog-$(date +%Y%m%d-%H%M%S)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "chore(changelog): regenerate from conventional commits

          [skip changelog]"
          git push -u origin "$branch"
          # Before opening a new PR, close any older open bot/changelog-* PRs
          # against the same base so we don't accumulate duplicate PRs if a
          # maintainer hasn't merged the previous one before another push lands.
          for pr in $(gh pr list --repo "${{ github.repository }}" \
                                 --base "$BASE_BRANCH" \
                                 --head 'bot/changelog-' \
                                 --state open \
                                 --json number,headRefName \
                                 --jq '.[] | select(.headRefName != "'"$branch"'") | .number'); do
            echo "Closing superseded changelog PR #$pr"
            gh pr close "$pr" --repo "${{ github.repository }}" \
              --comment "Superseded by a newer changelog regeneration PR."
          done
          gh pr create \
            --repo "${{ github.repository }}" \
            --title "chore(changelog): regenerate from conventional commits" \
            --body "Auto-generated by hyperpolymath/standards changelog-reusable.yml.

            [skip changelog]

            This PR body carries the [skip changelog] marker so that a
            squash-merge of this PR will not re-trigger the changelog
            workflow (loop-prevention added in response to maa-framework#219).
            Please do not remove that marker when editing the description.

            Closes part of the 2026-05-26 CHANGELOG gap (standards#197 audit)." \
            --base "$BASE_BRANCH" \
            --head "$branch"

      - name: Mode = release-only — attach to release
        if: ${{ inputs.mode == 'release-only' && github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Release tag names are event data and may contain shell
          # metacharacters; pass through env, never inline
          # (actions/command-injection).
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          gh release upload "$tag" caller/CHANGELOG.md.new \
            --clobber \
            --repo "${{ github.repository }}"
          echo "Attached CHANGELOG.md to release $tag"
