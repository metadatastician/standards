# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Fail closed when .github/workflows/actions.lock drifts from the workflows.
#
# This repo's .githooks validators ran ONLY in pre-commit, and Dependabot
# never runs pre-commit -- which is exactly how a codeql-action bump landed
# in three reusable workflows without regenerating the lockfile, poisoning
# every repo that calls them. A pre-commit hook cannot gate a bot; this can.
name: Actions Lockfile Gate

# NO `paths:` FILTER, deliberately. This check is meant to be REQUIRED, and a
# required check whose workflow is skipped by path filtering never reports:
# the PR sits on "Expected -- waiting for status" forever. Every PR that does
# not touch .github/** would be permanently unmergeable. The job is a
# checkout plus a few seconds of bash, so it runs on everything.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-coverage:
    name: uses ⊆ actions.lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Every SHA-pinned uses: must be in the lockfile"
        run: bash .githooks/validate-actions-lock.sh

      # Coverage above proves every `uses:` HAS a record. It says nothing about
      # whether the runner will ACCEPT that record, and the runner rejects a
      # leaf whose `ref:` repeats its own SHA ("invalid lockfile pin") at
      # `Set up job` — before any policy step, in every caller of this
      # repository, with the reason visible only on the run page.
      # MEASURED: metadatastician/svalinn run 40108154356 on standards
      # fad242d3, 12/12 governance jobs dead at setup. standards#1271 corrected
      # nine such leaves; #1290 measured four that survived and asked for a
      # guard "so a leaf entry whose ref: equals the 40-hex SHA in its own key
      # cannot be committed again". This is that guard, adopted from
      # hyperpolymath/cicd-suite#66 and extended with provenance conjugation
      # and the closure check (see the script header for what it does NOT
      # prove).
      - name: "actions.lock representation, provenance and closure"
        run: bash scripts/check-lock-pin-contract.sh .github/workflows/actions.lock

      # Explicit, even though check-lock-pin-contract.sh delegates to
      # close-lock.sh --check: a reader of this workflow should see closure
      # named as its own obligation (standards#963, cicd-squabbler#101), not
      # infer it from another script's internals.
      - name: "actions.lock is transitively closed"
        run: bash scripts/close-lock.sh --check .github/workflows/actions.lock

      # Closure above is a property of THIS file: delete an edge from
      # `workflows:` and its record from `dependencies:` together and the
      # lockfile is still perfectly closed. Completeness is a property measured
      # against the callee graph at the pinned commits, which is why it needs an
      # artefact independent of the current lock — the reviewed baseline in
      # .github/workflows/actions-lock.closure.tsv.
      #
      # `gh actions-lock` documents that it does not lock remote job-level
      # reusable calls, so a regeneration can drop a dependency this repository
      # really resolves at startup. Measured 2026-10-31:
      # hyperpolymath/unified-dataset-vocab#81 records actions/checkout under
      # the caller for exactly that reason.
      - name: "Refs reached through remote reusable calls are recorded, and never dropped"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-reusable-closure.sh .github/workflows --repo "$GITHUB_REPOSITORY"
