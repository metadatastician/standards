# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# ECHIDNA proof verification — formal verification of Agda and Idris2 proofs.
#
# Scope:
#   - lol/proofs/theories/**/*.agda
#   - 2-protocols/avow/avow-lib/src/abi/*.idr
#
# Proof-corpus status (issue #748, updated 2026-09-17): the lol and AVOW
# corpora are EVICTED from this repo — and their jobs keep the presence
# Guard from #828 (honest green, no toolchain spend; they verify again
# unchanged if a corpus ever returns). The A2ML corpus will NEVER return:
# the a2ml project is OFFICIALLY RETIRED (owner ruling, 2026-09-17), so
# the idris2-a2ml job is EVICTED, not merely guarded. Verified before
# evicting: no live ruleset pins its check context (org ruleset
# Optimus-Branch #23359343 requires only CodeQL, CodeRabbit, SonarCloud,
# governance/Code-quality+docs, .github/dependabot.yml, uses⊆actions.lock;
# config/rulesets/*.json pin no proof contexts), so removing it cannot
# deadlock a PR.
#
# Dogfooding: standards repo defines ECHIDNA trust pipeline; this workflow
# applies that pipeline to the repo's own proofs.

name: ECHIDNA Proof Verification

on:
  push:
    branches: [main]
    paths:
      - 'lol/proofs/**'
      - '2-protocols/avow/avow-lib/src/abi/*.idr'
      - '.github/workflows/echidna-verify.yml'
  # NO path filter on pull_request, deliberately. It once existed because
  # `Idris2 - a2ml proofs` was recorded as a REQUIRED context; that is STALE —
  # verified 2026-09-17 against the live org ruleset: no ruleset pins any
  # proof context, and the a2ml job itself is now evicted (retired project).
  # The always-on shape is kept even so: the surviving jobs are second-level
  # presence Guards, and this workflow doubles as the repo's proof-hygiene
  # canary — letting proof-irrelevant PRs skip it would silently un-exercise
  # the Guards.
  pull_request:
  schedule:
    # Weekly re-verification to catch stale-proof drift
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Applied only to read-only check workflows
# (no publish/mutation), so cancelling a superseded run is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  detect-proof-changes:
    timeout-minutes: 5
    name: Detect proof changes
    runs-on: ubuntu-latest
    outputs:
      proofs: ${{ steps.check.outputs.proofs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Did this change touch any proof source?
        id: check
        shell: bash
        run: |
          # Non-PR events (push, schedule, dispatch) always verify.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "proofs=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
          if printf '%s\n' "$changed" | grep -qE '^(lol/proofs/|2-protocols/avow/avow-lib/src/abi/.*\.idr$|1-formats/k9/spec/proofs/|\.github/workflows/echidna-verify\.yml$)'; then
            echo "proofs=true" >> "$GITHUB_OUTPUT"
          else
            echo "proofs=false" >> "$GITHUB_OUTPUT"
          fi

  agda-lol:
    name: Agda — lol/proofs
    needs: detect-proof-changes
    if: needs.detect-proof-changes.outputs.proofs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Guard — proofs are evicted from this repo
        id: guard
        run: |
          # Same honesty guard idris2-avow got (see its Type-check step),
          # placed BEFORE the toolchain install so the weekly cron stops
          # spending minutes bootstrapping for a directory that does not
          # exist. lol/proofs moved to the lol repository; if the corpus ever
          # returns here, this job verifies again, unchanged (issue #748).
          if [ ! -d lol/proofs ]; then
            echo "::notice title=Agda proofs::lol/proofs is absent here — proofs were evicted to the lol repository. Nothing to type-check; remaining steps skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Agda
        if: steps.guard.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y agda agda-stdlib
          agda --version

      - name: Type-check proofs
        id: typecheck
        if: steps.guard.outputs.present == 'true'
        run: |
          set -eo pipefail
          echo "=== Agda proofs under lol/proofs ==="
          find lol/proofs/theories -name '*.agda' -print
          cd lol/proofs
          failed=""
          for f in $(find theories -name '*.agda'); do
            echo "--- checking $f ---"
            if ! agda --safe "$f" 2>&1 | tee -a ../../agda-verify.log; then
              failed="$failed$f"$'\n'
            fi
          done
          if [ -n "$failed" ]; then
            echo "::warning::agda --safe FAILED to type-check the following proof(s) (advisory until the evicted lol/proofs corpus's re-entry criteria are set; see issue #748):"
            printf '%s' "$failed" | sed 's/^/  - /'
          else
            echo "All Agda proofs type-checked cleanly."
          fi

      - name: Postulate audit
        if: steps.guard.outputs.present == 'true'
        run: |
          echo "=== Postulate usage in lol/proofs ==="
          grep -rn "postulate" lol/proofs/theories/ || echo "No postulates found"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agda-verify-log
          path: agda-verify.log
          if-no-files-found: ignore

  idris2-avow:
    name: Idris2 — AVOW consent proofs
    needs: detect-proof-changes
    if: needs.detect-proof-changes.outputs.proofs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Cache pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.pack
            ~/.idris2
          key: ${{ runner.os }}-idris2-pack-${{ hashFiles('**/pack.toml', '**/*.ipkg') }}
          restore-keys: |
            ${{ runner.os }}-idris2-pack-

      - name: Install Idris2 via pack
        # PROOF-POLICY §6 deviation, recorded in 3-practice/PROOF-NEEDS.adoc
        # (toolchain-deviations): installed outside Guix and the container, with
        # no pinned version or digest yet. State: open.
        run: |
          set -e
          if command -v idris2 >/dev/null 2>&1; then
            echo "idris2 already present: $(idris2 --version)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev chezscheme
          git clone --depth 1 https://github.com/stefan-hoeck/idris2-pack.git "$HOME/idris2-pack"
          cd "$HOME/idris2-pack"
          # pack's install.bash prompts for the scheme binary; feeding newlines
          # makes the prompt take its detected default (chezscheme) instead of
          # hitting EOF (which aborts the bootstrap and leaves pack uninstalled).
          yes '' | bash install.bash || echo "::warning::pack install had warnings"
          # pack installs its launcher into ~/.local/bin (newer layout) and/or
          # ~/.pack/bin (older); add both so `pack` resolves on PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pack/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.pack/bin:$PATH"
          # `install-api` is not a pack subcommand; `install-app idris2`
          # installs the idris2 executable into the pack bin dir so the
          # subsequent `idris2 --check` resolves. The base library (Prelude,
          # base, contrib) ships with idris2, so no .ipkg is needed for a
          # standalone --check.
          pack install-app idris2
          idris2 --version

      - name: Type-check AVOW proofs
        run: |
          export PATH="$HOME/.pack/bin:$PATH"
          # The per-file `if [ -f ]` guard below was written to tolerate absent
          # proofs, but the `cd` ahead of it was NOT guarded, so a missing
          # directory killed the step before the guard could ever run. In this
          # repo 2-protocols/avow/ holds only BINDING.adoc - the proofs live in the
          # avow-protocol repository - so the cd always failed and this job was
          # permanently red. It only became visible once the workflow began
          # running on pull requests.
          if [ ! -d 2-protocols/avow/avow-lib ]; then
            echo "::notice title=AVOW proofs::2-protocols/avow/avow-lib is not present here (this repo carries only the BINDING). Nothing to type-check."
            exit 0
          fi
          cd 2-protocols/avow/avow-lib
          for f in src/abi/Consent.idr src/abi/Unsubscribe.idr src/abi/Types.idr; do
            if [ -f "$f" ]; then
              echo "--- checking $f ---"
              idris2 --check "$f" 2>&1 | tee -a ../../idris2-avow.log
            fi
          done

      - name: Type-check the K9 Hunt-gate proof (K9-CONTRACT-SPEC §9.2)
        run: |
          export PATH="$HOME/.pack/bin:$HOME/.local/bin:$PATH"
          # PROOF-POLICY §1: an interface property, proved in Idris2. Its bridge
          # to the Nickel text is the exhaustive check that
          # `k9-validate.sh --self-test` runs in k9-conformance.yml.
          # `idris2 --check` can exit 0 on a missing import while printing
          # `Error:`, so this step fails on either.
          cd 1-formats/k9/spec/proofs
          set +e
          out="$(idris2 --check HuntGate.idr 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$out" | tee "$GITHUB_WORKSPACE/idris2-k9.log"
          if [ "$rc" -ne 0 ] || printf '%s\n' "$out" | grep -qE '^Error:'; then
            echo "::error title=K9 Hunt-gate proof::HuntGate.idr does not typecheck"
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idris2-avow-log
          path: |
            idris2-avow.log
            idris2-k9.log
          if-no-files-found: ignore

  trust-summary:
    timeout-minutes: 10
    name: Trust pipeline summary
    needs: [detect-proof-changes, agda-lol, idris2-avow]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarise
        run: |
          echo "## ECHIDNA Trust Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Agda lol/proofs | ${{ needs.agda-lol.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Idris2 a2ml | _evicted — a2ml project officially retired 2026-09-17 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Idris2 avow + K9 Hunt gate | ${{ needs.idris2-avow.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See artefacts for verification logs." >> "$GITHUB_STEP_SUMMARY"
