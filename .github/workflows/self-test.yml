# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# self-test — run this repo's own test suite.
#
# WHY: `tests/test_check_trusted_base.sh` has existed for some time and was
# wired into NO workflow. A test that never executes is indistinguishable from
# a test that passes — the same shape as the `continue-on-error` gitleaks step
# and the `./src`-only rust-secrets grep. This workflow closes that gap by
# running every `tests/*.sh`, so adding a test is enough to have it enforced.
#
# The suite is deliberately FAIL-CLOSED: an empty tests/ directory, a
# non-executable test, or a missing interpreter fails the job rather than
# reporting a vacuous pass.

name: Self Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Repo self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-lock-gate-pin-freshness.sh compares the lock gate's pinned
          # commit against the base ref. A depth-1 clone has neither object, and
          # that guard fails rather than skipping on an unresolvable pin, so the
          # history is a requirement and not an optimisation.
          fetch-depth: 0

      # The secret-scanner canary reads YAML with yq (preinstalled on the
      # runner; YAML-POLICY Y-1) -- no Python. Shell tests use ripgrep
      # (wave9-session-detritus-test.sh); the Ruby tests need minitest.
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep ruby ruby-minitest

      # scripts/tests/check-ijson-jcs-test.sh needs the real tool; it exits 2
      # without it. Same pin as ijson-jcs.yml (JSON-POLICY §3).
      - name: Install ijson-jcs
        run: cargo install --git https://github.com/hyperpolymath/ijson-jcs --rev 0fdeea716fd558e9807362acf6f8202d56d8d88f --locked ijson-jcs

      # scripts/tests/js-runtimes-test.sh needs all three runtimes; it exits 2
      # without them. Same pins as js-runtimes-reusable.yml (keep in step).
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"
      - name: Set up pnpm (Corepack, hash-pinned)
        env:
          PNPM_PIN: pnpm@10.28.0+sha512.05df71d1421f21399e053fde567cea34d446fa02c76571441bfc1c7956e98e363088982d940465fd34480d4d90a0668bc12362f8aa88000a64e83d0b0e47be48
        run: corepack enable pnpm && corepack install -g "$PNPM_PIN"
      # scripts/tests/gh-actions-lock-contract-test.sh runs the real binary; it
      # exits 2 without it. The version must match every `--pin` in this tree
      # (the test fails when they disagree); the hash is the release asset's.
      - name: Install gh-actions-lock
        run: |
          set -euo pipefail
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/gh-actions-lock" https://github.com/github/gh-actions-lock/releases/download/v0.2.0/linux-amd64
          echo "79ec84c191667fd935a277e6fd3662cf5d3669cccc9e99998731d8f306f373b6  $RUNNER_TEMP/gh-actions-lock" | sha256sum --check
          chmod u+x "$RUNNER_TEMP/gh-actions-lock"
          echo "GH_ACTIONS_LOCK_BIN=$RUNNER_TEMP/gh-actions-lock" >> "$GITHUB_ENV"

      - name: Reject former-owner workflow coordinates
        run: bash scripts/check-workflow-coordinates.sh

      # Every checkout of THIS repository from a shared workflow must name the
      # commit it came from. MEASURED 2026-10-31: three steps staged helpers
      # from the literal 317101e03b8f (2026-09-14) while main had moved 202
      # files (+29,544/−1,736 lines) under scripts/, so every consumer was judged by six-week-old
      # gate code — and standards' own self-lint path (which runs its local
      # tree) could never notice. A branch here would be worse still.
      - name: Standards helper checkouts are immutable and fresh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          COMPARE="${BASE_SHA:-$GITHUB_SHA}"
          bash scripts/check-standards-helper-pins.sh .github/workflows --compare "$COMPARE"

      - name: Lock-gate pin is not stale
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          COMPARE="${BASE_SHA:-$GITHUB_SHA}"
          bash scripts/check-lock-gate-pin-freshness.sh "$COMPARE"

      # The fixture-driven controls for the guards above. They live in
      # scripts/tests/ and the general suite runs them too, but that suite is
      # red on main (dismiss-code-scanning-alerts-test.sh) and stops at its
      # first failure, so a control that is only "in the suite" is a control
      # nobody sees the result of. Named here so their verdict is never
      # contingent on an unrelated red.
      - name: Guard controls (fixture-driven)
        run: |
          set -euo pipefail
          bash scripts/tests/check-lock-pin-contract-test.sh
          bash scripts/tests/check-standards-helper-pins-test.sh
          bash scripts/tests/check-reusable-closure-test.sh
          bash scripts/tests/governance-canary-test.sh

      - name: Run tests/*.sh and scripts/tests/*.sh
        run: bash scripts/run-shell-test-suite.sh

      # The suite above runs with whatever `awk` this image offers, and on
      # ubuntu-latest that is gawk. mawk is the default awk on a plain Debian or
      # Ubuntu install, and it rejects gawk-only constructs at parse time, so a
      # script can be green here and dead on a contributor's machine (or on a
      # slimmer runner) with "awk: syntax error at or near ,". Re-run the awk-
      # heavy regression suite with `awk` shadowed by mawk so that class of
      # breakage fails CI. Add a test here when a gate's correctness depends on
      # awk program text; scripts/prune-stale.sh is exempt because it probes for
      # gawk and fails closed with a clear message instead.
      - name: awk-dependent gates also run under mawk
        run: |
          set -euo pipefail
          if ! command -v mawk >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends mawk
          fi
          shim="$RUNNER_TEMP/awk-shim"
          mkdir -p "$shim"
          ln -sf "$(command -v mawk)" "$shim/awk"
          echo "awk -> $(PATH="$shim:$PATH" awk -W version 2>&1 | head -1)"
          PATH="$shim:$PATH" bash scripts/tests/check-lock-sync-test.sh

      # KYAML ratchet (YAML-POLICY Y-3, §5 step 5, standards#1024): every file
      # already converted must stay KYAML. A file joins this list in the PR that
      # converts it and never leaves it. Workflows are not listed here (step 6,
      # standards#1025), and neither are files read by a third-party bot
      # (Dependabot, FUNDING, issue forms, GitLab CI, Copilot).
      - name: Converted YAML stays KYAML
        run: |
          set -euo pipefail
          bash scripts/kyaml-format.sh --check \
            _shared/container/.gatekeeper.yaml

      # A2ML is retired: every A2ML file sits under 9-archive/ or is named in
      # the shrink-only legacy ledger (.machine_readable/a2ml-legacy-allow.txt).
      # The fixtures in scripts/tests/check-a2ml-archived-test.sh prove the
      # gate; this step holds the repository itself to it. --base compares
      # ledger membership with the base, so an entry cannot join it even when
      # another leaves (the count-only exemption ratchet misses that swap).
      # On a pull request the base is the PR base; on main it is the previous
      # commit. fetch-depth: 0 above makes both resolvable.
      - name: A2ML stays archived
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          bash scripts/check-a2ml-archived.sh --base "${BASE_SHA:-HEAD~1}" .

      # Not part of the offline suite: this one needs real git history, so it
      # cannot live in scripts/tests/*.sh where a contributor runs it on a
      # shallow or detached tree. On a pull request the comparison is the base
      # SHA, so a PR that edits a helper is not asked to pin to its own
      # unborn merge commit; on main it is HEAD, so the bump owed after such a
      # PR lands shows up immediately instead of rotting silently.

  hypatia-projection:
    name: Hypatia single-scan projection contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'
      - name: Check out vetted Hypatia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/hypatia
          ref: adb2f41db34156cf81b2508f6596a10c7f076098
          path: .hypatia-projection-source
          persist-credentials: false
      - name: Build the real SARIF renderer
        working-directory: .hypatia-projection-source
        run: |
          mix deps.get
          mix escript.build
      - name: Exercise the reusable projection with real Hypatia
        env:
          HYPATIA_SOURCE: ${{ github.workspace }}/.hypatia-projection-source
        run: bash scripts/integration-hypatia-projection.sh
