# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
#
# apply-workflow-pins — re-point consumer repositories at the current standards
# reusable-workflow SHA, on a cadence.
#
# WHY A SCHEDULED APPLIER AND NOT A SWEEP (owner ruling STD-R-3):
#   A fix landed in `standards` does not reach its callers. Measured 2026-09-15,
#   28 of 29 live remote callers are SHA-pinned and exactly one tracks `@main`.
#   A pinned caller keeps consuming the broken commit until something re-points
#   it. A sweep does that once and then rots; an applier converges and keeps
#   converging, which is what "the estate stays fixed" actually requires.
#
# DEFAULT IS AUDIT. The scheduled run writes nothing unless `mode: fix` is
# chosen explicitly via workflow_dispatch, because the first thing this needs to
# produce is an honest census — how many repos are BEHIND, DEAD-REF or ILLEGAL —
# and a census is evidence only while nothing is mutating underneath it.

name: apply workflow pins

on:
  schedule:
    # Sundays 06:11 UTC. Offset off the hour: the estate's other scheduled jobs
    # cluster on :00 and contend for the same rate-limit bucket.
    - cron: '11 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit (default, writes nothing) or fix (opens PRs)'
        type: choice
        options: [audit, fix]
        default: audit
      repair_illegal:
        description: 'Also repair unparseable `uses: ../../` refs (issue #808)'
        type: boolean
        default: false
      owners:
        description: 'Comma-separated owners to walk'
        default: 'hyperpolymath,metadatastician,catachresis-colloquium'
      limit:
        description: 'Stop after N repos (0 = no limit). In fix mode N counts PRs attempted, not repos walked'
        default: '0'
      ensure_squabbler:
        description: 'Also add the CICD Squabbler gate where a repo has none (same PR as the re-pin)'
        type: boolean
        default: false
      proven_sha:
        description: 'proven-cicd-and-workflows commit whose proven/manifest.json the content census reads (40-hex; empty = the pin below; off = no content census)'
        default: ''
      only:
        description: 'Restrict the run to ONE repository, as owner/name (empty = walk every repo). Only that repository''s owner is walked; every other owner in `owners` is skipped. Use for a pilot: `limit` alone cannot choose WHICH repo gets the PR.'
        default: ''

concurrency:
  group: apply-workflow-pins
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Re-point standards pins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WHICH App's credentials belong in vars.APP_ID / secrets.APP_PRIVATE_KEY:
      # a DEDICATED App for this applier, explicitly NOT OikosBot. Owner ruling
      # STD-R-3 / R-14 (2026-09-15). OikosBot is named as a BYPASS ACTOR in the
      # estate's rulesets; if the thing that re-points pins authenticated as the
      # identity that may bypass the rules, it would be permanently exempt from
      # the rules it exists to uphold. Separation of duties, not style.
      #
      # The App needs `contents: write` and `pull_requests: write`, and must be
      # installed on EVERY owner walked. An installation token is scoped to ONE
      # owner and carries its own rate limit, so `owner:` is required — without
      # it the token is scoped to THIS repository and every consumer write 404s.
      # For the same reason the applier runs once PER OWNER with that owner's
      # token (see "Run the applier"): one token cannot write to another owner's
      # repositories.
      - name: Mint an App installation token for hyperpolymath
        id: tok-user
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        continue-on-error: true
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: hyperpolymath

      - name: Mint an App installation token for metadatastician
        id: tok-org
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        continue-on-error: true
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: metadatastician

      # The 5 repositories that moved from metadatastician on 2026-11-10
      # (gv-clade-index ADR 0007) and the rest of this owner's callers: 26
      # repositories pinned a former-owner standards reusable in the 2026-11-10
      # census, and no run reached them.
      - name: Mint an App installation token for catachresis-colloquium
        id: tok-cc
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        continue-on-error: true
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: catachresis-colloquium

      # A nonexistent secret resolves to an EMPTY STRING in silence, and a run
      # over an empty credential reports a clean sweep while writing nothing.
      # Decide here, before any enumeration, and say exactly what is missing.
      # Audit mode may proceed on the read-only GITHUB_TOKEN; fix mode may not.
      - name: Decide which credential is in play
        id: cred
        env:
          TOK_HYPERPOLYMATH: ${{ steps.tok-user.outputs.token }}
          TOK_METADATASTICIAN: ${{ steps.tok-org.outputs.token }}
          TOK_CATACHRESIS_COLLOQUIUM: ${{ steps.tok-cc.outputs.token }}
          MODE: ${{ inputs.mode || 'audit' }}
          OWNERS: ${{ inputs.owners || 'hyperpolymath,metadatastician,catachresis-colloquium' }}
        run: |
          set -euo pipefail
          # Every owner walked needs its OWN installation token: a token for one
          # owner cannot write to another owner's repositories. Until 2026-11-10
          # this step checked only the hyperpolymath token, and the run step used
          # it for every owner, so fix mode could not write to metadatastician.
          missing=""
          for owner in ${OWNERS//,/ }; do
            var="TOK_$(printf '%s' "$owner" | tr 'a-z-' 'A-Z_')"
            [ -n "${!var:-}" ] || missing="${missing} ${owner}"
          done
          if [ -z "$missing" ]; then
            echo "have_app=true" >> "$GITHUB_OUTPUT"
            echo "An App credential is present for every owner: ${OWNERS}."
            exit 0
          fi
          echo "have_app=false" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "fix" ]; then
            echo "::error::fix mode was requested but there is no App installation token for:${missing}." >&2
            cat >&2 <<'MSG'
          FATAL: vars.APP_ID and secrets.APP_PRIVATE_KEY must both be set, and the
            App must be installed on every owner walked (an installation token
            is scoped to one owner). Refusing to report a clean run that wrote
            nothing.
          MSG
            exit 1
          fi
          echo "::notice::AUDIT-ONLY: no App credential for:${missing}; those owners' census runs on GITHUB_TOKEN (public repositories only)."

      - name: Run the applier
        env:
          # Each owner's App token; GITHUB_TOKEN is the audit-only fallback
          # (the previous step has already refused fix mode without them).
          TOK_HYPERPOLYMATH: ${{ steps.tok-user.outputs.token }}
          TOK_METADATASTICIAN: ${{ steps.tok-org.outputs.token }}
          TOK_CATACHRESIS_COLLOQUIUM: ${{ steps.tok-cc.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'audit' }}
          REPAIR: ${{ inputs.repair_illegal || false }}
          OWNERS: ${{ inputs.owners || 'hyperpolymath,metadatastician,catachresis-colloquium' }}
          LIMIT: ${{ inputs.limit || '0' }}
          ENSURE_SQUABBLER: ${{ inputs.ensure_squabbler || false }}
          PROVEN_SHA_INPUT: ${{ inputs.proven_sha || '' }}
          ONLY: ${{ inputs.only || '' }}
        run: |
          set -euo pipefail
          # Proven content census (read-only in every mode; see the script's
          # PROVEN CONTENT header). The scheduled run reads proven/manifest.json
          # of hyperpolymath/proven-cicd-and-workflows at this pinned commit;
          # a dispatch may name another 40-hex commit, or `off`. An unreadable
          # manifest degrades loudly: that owner's pin census still completes,
          # the census gets a CONTENT-CENSUS-FAILED row, and the job ends red.
          PROVEN_PIN="c4b4256dd8b24462e2531a57c2f34384aeb218dd"
          case "$PROVEN_SHA_INPUT" in
            off) PROVEN_SHA="" ;;
            '')  PROVEN_SHA="$PROVEN_PIN" ;;
            *)   PROVEN_SHA="$PROVEN_SHA_INPUT" ;;
          esac
          # One applier run per owner, each with that owner's token. LIMIT
          # applies per owner: a canary of `limit: 5` over three owners opens
          # at most 15 PRs (narrow it with `owners:`).
          rc=0; first=1
          # `only` names ONE repository (owner/name): reject a malformed value
          # before any run, then walk only that repository's owner. An `only`
          # that matches none of the owners walked is an error, not a clean sweep.
          if [ -n "$ONLY" ]; then
            case "$ONLY" in
              */*/*|/*|*/|*[!A-Za-z0-9._/-]*) echo "::error::only must be owner/name, got '${ONLY}'" >&2; exit 1 ;;
              */*) ;;
              *) echo "::error::only must be owner/name, got '${ONLY}'" >&2; exit 1 ;;
            esac
            case ",${OWNERS}," in
              *",${ONLY%%/*},"*) ;;
              *) echo "::error::only=${ONLY}: its owner is not in owners (${OWNERS}); refusing to report a clean run that walked nothing" >&2; exit 1 ;;
            esac
          fi
          for owner in ${OWNERS//,/ }; do
            if [ -n "$ONLY" ] && [ "${ONLY%%/*}" != "$owner" ]; then continue; fi
            var="TOK_$(printf '%s' "$owner" | tr 'a-z-' 'A-Z_')"
            args=(--owners "$owner" --limit "$LIMIT" --out "census-${owner}.tsv")
            [ -n "$ONLY" ] && args+=(--only "$ONLY")
            [ "$MODE" = "fix" ] && args+=(--fix)
            [ "$REPAIR" = "true" ] && args+=(--repair-illegal)
            [ "$ENSURE_SQUABBLER" = "true" ] && args+=(--ensure-squabbler)
            [ -n "$PROVEN_SHA" ] && args+=(--proven-sha "$PROVEN_SHA")
            echo "::group::applier: ${owner}"
            GH_TOKEN="${!var:-$FALLBACK_TOKEN}" bash scripts/apply-workflow-pins-remote.sh "${args[@]}" || rc=$?
            echo "::endgroup::"
            # One merged census, one header row.
            if [ -f "census-${owner}.tsv" ]; then
              if [ "$first" -eq 1 ]; then cat "census-${owner}.tsv" > census.tsv; first=0
              else tail -n +2 "census-${owner}.tsv" >> census.tsv; fi
            fi
          done
          # An owner whose run failed (enumeration, auth, controls) fails the
          # job after the other owners have still been walked.
          exit "$rc"

      - name: Summarise the census
        if: always()
        run: |
          set -euo pipefail
          [ -f census.tsv ] || { echo "no census produced"; exit 0; }
          {
            echo '### standards pin census'
            echo
            echo '| status | files |'
            echo '|---|---|'
            awk -F'\t' 'NR>1{c[$3]++} END{for(k in c) printf "| %s | %d |\n", k, c[k]}' census.tsv | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the census
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-pin-census
          path: census.tsv
          if-no-files-found: warn
