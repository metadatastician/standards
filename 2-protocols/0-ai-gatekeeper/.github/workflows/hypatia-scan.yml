# SPDX-License-Identifier: MPL-2.0
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@b5a8c536780e3a250e71dfe99ecdf18582638965
    # Only the callee's one declared secret (HYPATIA_SCAN_PAT, optional) —
    # passing any secret the callee does not declare startup-fails the run.
    # Do not use `secrets: inherit`: it forwards every repo/org secret the
    # caller can see, not just this one (standards#1108 §6b).
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
